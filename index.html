<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Women's Day</title>

<style>

body{
margin:0;
height:100vh;
background: radial-gradient(circle at bottom, #02121c, #000);
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;
}

/* text */

.title{
font-size:40px;
color:#ff6aa9;
margin-bottom:10px;
}

.message{
font-size:18px;
margin-bottom:70px;
}

/* garden */

.garden{
display:flex;
gap:140px;
}

/* plant */

.plant{
width:170px;
animation:sway 4s ease-in-out infinite;
transform-origin:bottom center;
}

.p2{animation-delay:1s;}
.p3{animation-delay:2s;}

@keyframes sway{
0%{transform:rotate(-6deg);}
50%{transform:rotate(6deg);}
100%{transform:rotate(-6deg);}
}

/* glow */

.petal{
filter:drop-shadow(0 0 12px rgba(255,120,170,0.7));
}

/* stars */

.stars{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
}

.stars::after{
content:"";
position:absolute;
width:2px;
height:2px;
background:white;
box-shadow:
50px 100px white,
200px 300px white,
400px 150px white,
600px 500px white,
800px 200px white,
1000px 400px white,
1200px 250px white,
1400px 350px white,
1600px 100px white,
1800px 450px white;
}

/* fireflies */

.firefly{
position:absolute;
width:6px;
height:6px;
background:yellow;
border-radius:50%;
box-shadow:0 0 10px yellow;
animation:fly 6s infinite ease-in-out alternate;
}

@keyframes fly{
0%{transform:translate(0,0);opacity:0.3;}
50%{transform:translate(120px,-80px);opacity:1;}
100%{transform:translate(-100px,100px);opacity:0.4;}
}

</style>
</head>

<body>

<div class="stars"></div>

<div>

<h1 class="title">Happy Women's Day</h1>

<p class="message">
Chúc Mai 8/3 vui vẻ, hạnh phúc và càng ngày xinh đẹp hơn.<br>
🌸 🌸 💖 Luôn luôn rạng rỡ 💖 🌸 🌸
</p>

<div class="garden">

<!-- plant 1 -->

<svg viewBox="0 0 200 360" class="plant">

<!-- stem -->
<rect x="97" y="120" width="6" height="190" fill="#6a4a2c"/>

<!-- leaves -->
<ellipse cx="75" cy="230" rx="28" ry="14" fill="#1f7a3f" transform="rotate(-35 75 230)"/>
<ellipse cx="125" cy="250" rx="28" ry="14" fill="#1f7a3f" transform="rotate(35 125 250)"/>

<!-- flower -->
<circle cx="100" cy="90" r="38" fill="#ff7aa8" class="petal"/>
<circle cx="60" cy="90" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="140" cy="90" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="100" cy="50" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="100" cy="130" r="26" fill="#ff9dc0" class="petal"/>

<circle cx="100" cy="90" r="14" fill="#ffd166"/>

<!-- long grass -->
<rect x="55" y="310" width="6" height="90" fill="#1ecb5a" transform="rotate(-35 55 310)"/>
<rect x="80" y="310" width="6" height="95" fill="#1ecb5a" transform="rotate(-15 80 310)"/>
<rect x="100" y="310" width="6" height="100" fill="#1ecb5a"/>
<rect x="120" y="310" width="6" height="95" fill="#1ecb5a" transform="rotate(15 120 310)"/>
<rect x="145" y="310" width="6" height="90" fill="#1ecb5a" transform="rotate(35 145 310)"/>

</svg>

<!-- plant 2 -->

<svg viewBox="0 0 200 360" class="plant p2">

<rect x="97" y="120" width="6" height="190" fill="#6a4a2c"/>

<ellipse cx="75" cy="230" rx="28" ry="14" fill="#1f7a3f" transform="rotate(-35 75 230)"/>
<ellipse cx="125" cy="250" rx="28" ry="14" fill="#1f7a3f" transform="rotate(35 125 250)"/>

<circle cx="100" cy="90" r="38" fill="#ff7aa8" class="petal"/>
<circle cx="60" cy="90" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="140" cy="90" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="100" cy="50" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="100" cy="130" r="26" fill="#ff9dc0" class="petal"/>

<circle cx="100" cy="90" r="14" fill="#ffd166"/>

<rect x="55" y="310" width="6" height="90" fill="#1ecb5a" transform="rotate(-35 55 310)"/>
<rect x="80" y="310" width="6" height="95" fill="#1ecb5a" transform="rotate(-15 80 310)"/>
<rect x="100" y="310" width="6" height="100" fill="#1ecb5a"/>
<rect x="120" y="310" width="6" height="95" fill="#1ecb5a" transform="rotate(15 120 310)"/>
<rect x="145" y="310" width="6" height="90" fill="#1ecb5a" transform="rotate(35 145 310)"/>

</svg>

<!-- plant 3 -->

<svg viewBox="0 0 200 360" class="plant p3">

<rect x="97" y="120" width="6" height="190" fill="#6a4a2c"/>

<ellipse cx="75" cy="230" rx="28" ry="14" fill="#1f7a3f" transform="rotate(-35 75 230)"/>
<ellipse cx="125" cy="250" rx="28" ry="14" fill="#1f7a3f" transform="rotate(35 125 250)"/>

<circle cx="100" cy="90" r="38" fill="#ff7aa8" class="petal"/>
<circle cx="60" cy="90" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="140" cy="90" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="100" cy="50" r="26" fill="#ff9dc0" class="petal"/>
<circle cx="100" cy="130" r="26" fill="#ff9dc0" class="petal"/>

<circle cx="100" cy="90" r="14" fill="#ffd166"/>

<rect x="55" y="310" width="6" height="90" fill="#1ecb5a" transform="rotate(-35 55 310)"/>
<rect x="80" y="310" width="6" height="95" fill="#1ecb5a" transform="rotate(-15 80 310)"/>
<rect x="100" y="310" width="6" height="100" fill="#1ecb5a"/>
<rect x="120" y="310" width="6" height="95" fill="#1ecb5a" transform="rotate(15 120 310)"/>
<rect x="145" y="310" width="6" height="90" fill="#1ecb5a" transform="rotate(35 145 310)"/>

</svg>

</div>

</div>

<div class="firefly" style="top:60%;left:30%"></div>
<div class="firefly" style="top:55%;left:50%"></div>
<div class="firefly" style="top:70%;left:70%"></div>
<div class="firefly" style="top:65%;left:40%"></div>
<div class="firefly" style="top:40%;left:20%"></div>
<div class="firefly" style="top:45%;left:80%"></div>
<div class="firefly" style="top:30%;left:60%"></div>
  
</body>
</html>
