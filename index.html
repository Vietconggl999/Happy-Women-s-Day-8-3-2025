<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Women's Day</title>

<style>

body{
margin:0;
height:100vh;
background:#04161d;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;
}

/* text */

.title{
font-size:40px;
color:#ff6aa9;
margin-bottom:10px;
}

.message{
font-size:18px;
margin-bottom:50px;
}

/* garden */

.garden{
display:flex;
justify-content:center;
align-items:flex-end;
gap:80px;
}

/* flower group */

.flower-group{
display:flex;
flex-direction:column;
align-items:center;
}

/* flower */

.flower-real{
width:140px;
animation:sway 4s ease-in-out infinite;
transform-origin:bottom;
}

.flower-real circle{
filter:drop-shadow(0 0 12px rgba(255,120,170,0.7));
}

/* wind animation */

@keyframes sway{
0%{transform:rotate(-5deg);}
50%{transform:rotate(5deg);}
100%{transform:rotate(-5deg);}
}

/* grass */

.grass{
display:flex;
gap:8px;
margin-top:-10px;
}

.blade{
width:6px;
height:40px;
background:linear-gradient(#0a5a2c,#1ecb5a);
border-radius:50px;
}

.b1{transform:rotate(-25deg);}
.b2{transform:rotate(-10deg);}
.b3{transform:rotate(10deg);}
.b4{transform:rotate(25deg);}

</style>
</head>

<body>

<div>

<h1 class="title">Happy Women's Day</h1>

<p class="message">
Chúc Mai 8/3 vui vẻ, hạnh phúc và càng ngày xinh đẹp hơn.<br>
🌸🌸 💖 Luôn luôn rạng rỡ 💖 🌸🌸
</p>

<div class="garden">

<!-- flower 1 -->

<div class="flower-group">

<svg viewBox="0 0 200 300" class="flower-real">

<rect x="97" y="90" width="6" height="170" fill="#5c3d1a"/>

<ellipse cx="80" cy="180" rx="25" ry="12" fill="#1f7a3f" transform="rotate(-30 80 180)"/>
<ellipse cx="120" cy="200" rx="25" ry="12" fill="#1f7a3f" transform="rotate(30 120 200)"/>

<circle cx="100" cy="100" r="35" fill="#ff7aa8"/>
<circle cx="70" cy="100" r="25" fill="#ff9dc0"/>
<circle cx="130" cy="100" r="25" fill="#ff9dc0"/>
<circle cx="100" cy="70" r="25" fill="#ff9dc0"/>
<circle cx="100" cy="130" r="25" fill="#ff9dc0"/>

<circle cx="100" cy="100" r="12" fill="#ffd166"/>

</svg>

<div class="grass">
<div class="blade b1"></div>
<div class="blade b2"></div>
