<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Women's Day</title>

<style>

body{
margin:0;
height:100vh;
background:#04161d;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;
}

/* chữ */

.title{
font-size:40px;
color:#ff6aa9;
margin-bottom:10px;
}

.message{
font-size:18px;
margin-bottom:40px;
}

/* khu vực hoa */

.flowers{
position:relative;
height:300px;
}

/* từng bông hoa */

.flower{
position:absolute;
bottom:0;
animation:sway 4s ease-in-out infinite;
transform-origin:bottom;
}

.f1{left:-120px; animation-delay:0s;}
.f2{left:0px; animation-delay:1s;}
.f3{left:120px; animation-delay:2s;}

.stem{
width:6px;
height:180px;
background:#6a4a2c;
margin:auto;
}

.petal{
width:60px;
height:60px;
background:pink;
border-radius:50%;
margin:auto;
margin-top:-20px;
box-shadow:
-30px 0 pink,
30px 0 pink,
0 -30px pink;
}

/* animation gió */

@keyframes sway{

0%{transform:rotate(-5deg);}
50%{transform:rotate(5deg);}
100%{transform:rotate(-5deg);}

}
  
.garden{
display:flex;
justify-content:center;
margin-top:60px;
}

.flower-real{
width:200px;
animation:sway 4s ease-in-out infinite;
transform-origin:bottom;
}

.flower-real circle{
filter:drop-shadow(0 0 12px rgba(255,120,170,0.7));
}
  
</style>
</head>

<body>

<div class="scene">

<h1 class="title">Happy Women's Day 💖</h1>

<p class="message">
Chúc Mai 8/3 vui vẻ, hạnh phúc và càng ngày xinh đẹp hơn.<br>
🌸 💖 Luôn luôn rạng rỡ 💖 🌸
</p>

<div class="garden">

<svg viewBox="0 0 200 300" class="flower-real">

  <!-- stem -->
  <rect x="97" y="120" width="6" height="120" fill="#5c3d1a"/>

  <!-- leaves -->
  <ellipse cx="80" cy="180" rx="25" ry="12" fill="#1f7a3f" transform="rotate(-30 80 180)"/>
  <ellipse cx="120" cy="200" rx="25" ry="12" fill="#1f7a3f" transform="rotate(30 120 200)"/>

  <!-- petals -->
  <circle cx="100" cy="100" r="35" fill="#ff7aa8"/>
  <circle cx="70" cy="100" r="25" fill="#ff9dc0"/>
  <circle cx="130" cy="100" r="25" fill="#ff9dc0"/>
  <circle cx="100" cy="70" r="25" fill="#ff9dc0"/>
  <circle cx="100" cy="130" r="25" fill="#ff9dc0"/>

  <!-- center -->
  <circle cx="100" cy="100" r="12" fill="#ffd166"/>

</svg>

</div>

</div>

</body>
</html>
