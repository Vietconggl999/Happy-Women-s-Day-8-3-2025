<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Women's Day</title>

<style>

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at center, #02121f 0%, #000 100%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* lớp sao */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  background-image:
    radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.6), transparent),
    radial-gradient(1.5px 1.5px at 40px 70px, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 200px 200px, rgba(255,255,255,0.4), transparent),
    radial-gradient(2px 2px at 300px 150px, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 400px 100px, rgba(255,255,255,0.3), transparent),
    radial-gradient(2px 2px at 500px 200px, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 600px 50px, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.5px 1.5px at 700px 120px, rgba(255,255,255,0.4), transparent);
  
  background-repeat: repeat;
  background-size: 800px 600px;
  opacity: 0.6;
}

/* text */

.title{
font-size:64px;
color:#ff6aa9;
margin-bottom:20px;
letter-spacing:2px;
text-align: center;
}

.message{
font-size:26px;
margin-bottom:50px;
line-height:1.6;
text-align: center;
}

/* garden */

.garden{
display:flex;
justify-content: center;
align-items: center;
margin-top:0;
position:relative;
z-index:1;
}

.title,.message{
position:relative;
z-index:10;
text-align: center;
}

/* plant */

.plant{
width:420px;
animation:sway 4s ease-in-out infinite;
transform-origin:bottom center;
}

.p2{animation-delay:1s;}
.p3{animation-delay:2s;}

@keyframes sway{
0%{transform:rotate(-6deg);}
50%{transform:rotate(6deg);}
100%{transform:rotate(-6deg);}
}

/* glow */

.petal{
filter:drop-shadow(0 0 12px rgba(255,120,170,0.7));
}

/* grass */

.grass{
transform-origin:bottom;
animation:grassMove 6s ease-in-out infinite;
}

@keyframes grassMove{
0%{transform:rotate(-3deg);}
50%{transform:rotate(3deg);}
100%{transform:rotate(-3deg);}
}

/* stars */

.stars{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
}

.stars::after{
content:"";
position:absolute;
width:2px;
height:2px;
background:white;
box-shadow:
50px 100px white,
120px 200px white,
200px 300px white,
300px 150px white,
400px 220px white,
500px 90px white,
600px 180px white,
700px 260px white,
800px 120px white,
900px 340px white,
1000px 200px white,
1100px 150px white,
1200px 260px white,
1300px 90px white,
1400px 210px white,
1500px 330px white,
1600px 140px white,
1700px 260px white,
1800px 120px white,
1900px 300px white,
200px 500px white,
400px 550px white,
600px 600px white,
800px 520px white,
1000px 580px white,
1200px 620px white,
1400px 540px white,
1600px 610px white,
1800px 500px white;
}

/* fireflies */

.firefly{
position:absolute;
width:6px;
height:6px;
background:yellow;
border-radius:50%;
box-shadow:0 0 10px yellow;
animation:fly 6s infinite ease-in-out alternate;
}

@keyframes fly{
0%{transform:translate(0,0);opacity:0.3;}
50%{transform:translate(120px,-80px);opacity:1;}
100%{transform:translate(-100px,100px);opacity:0.4;}
}

</style>
</head>

<body>

<div class="stars"></div>

<div style="text-align: center;">

<h1 class="title">Happy Women's Day</h1>

<p class="message">
Chúc Mai 8/3 vui vẻ, hạnh phúc và càng ngày xinh đẹp hơn.<br>
🌸 🌸 💖 Luôn luôn rạng rỡ 💖 🌸 🌸
</p>

<div class="garden">

<!-- PLANT TEMPLATE -->

<!-- plant 1 -->
<svg viewBox="0 0 200 360" class="plant">

<rect x="97" y="110" width="8" height="250" fill="#7a5532" rx="4"/>

<ellipse cx="75" cy="230" rx="28" ry="14" fill="#1f7a3f" transform="rotate(-35 75 230)"/>
<ellipse cx="125" cy="250" rx="28" ry="14" fill="#1f7a3f" transform="rotate(35 125 250)"/>

<g class="petal">

<!-- hoa giữa -->
<ellipse cx="100" cy="65" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="135" cy="95" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="65" cy="95" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="115" cy="120" rx="28" ry="34" fill="#ff8fb5"/>
<ellipse cx="85" cy="120" rx="28" ry="34" fill="#ff8fb5"/>

<!-- hoa trái -->
<ellipse cx="40" cy="100" rx="26" ry="30" fill="#ff9dc0"/>
<ellipse cx="55" cy="120" rx="24" ry="28" fill="#ff8fb5"/>

<!-- hoa phải -->
<ellipse cx="160" cy="100" rx="26" ry="30" fill="#ff9dc0"/>
<ellipse cx="145" cy="120" rx="24" ry="28" fill="#ff8fb5"/>

</g>

<circle cx="100" cy="95" r="16" fill="#ffd166"/>
<circle cx="50" cy="110" r="12" fill="#ffd166"/>
<circle cx="150" cy="110" r="12" fill="#ffd166"/>
  
<g class="grass">
<path d="M100 360 Q80 250 70 170" stroke="#1ecb5a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q60 260 40 200" stroke="#22d36a" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q120 250 130 170" stroke="#1ecb5a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q150 260 165 210" stroke="#22d36a" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q90 280 95 200" stroke="#28e070" stroke-width="4" fill="none" stroke-linecap="round"/>
</g>

</svg>


</div>

</div>

<div class="firefly" style="top:60%;left:30%"></div>
<div class="firefly" style="top:55%;left:50%"></div>
<div class="firefly" style="top:70%;left:70%"></div>
<div class="firefly" style="top:65%;left:40%"></div>
<div class="firefly" style="top:40%;left:20%"></div>
<div class="firefly" style="top:45%;left:80%"></div>
<div class="firefly" style="top:30%;left:60%"></div>

</body>
</html>
