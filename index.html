<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Women's Day</title>

<style>

body{
margin:0;
height:100vh;
background:#04161d;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;
}

/* text */

.title{
font-size:40px;
color:#ff6aa9;
margin-bottom:10px;
}

.message{
font-size:18px;
margin-bottom:60px;
}

/* garden */

.garden{
display:flex;
gap:120px;
}

/* cây */

.plant{
width:140px;
animation:sway 4s ease-in-out infinite;
transform-origin:bottom center;
}

.p2{animation-delay:1s;}
.p3{animation-delay:2s;}

/* gió */

@keyframes sway{

0%{transform:rotate(-6deg);}
50%{transform:rotate(6deg);}
100%{transform:rotate(-6deg);}

}

/* glow */

.petal{
filter:drop-shadow(0 0 12px rgba(255,120,170,0.7));
}

</style>
</head>

<body>

<div>

<h1 class="title">Happy Women's Day</h1>

<p class="message">
Chúc Mai 8/3 vui vẻ, hạnh phúc và càng ngày xinh đẹp hơn.<br>
🌸 🌸 💖 Luôn luôn rạng rỡ 💖 🌸 🌸
</p>

<div class="garden">

<!-- cây 1 -->

<svg viewBox="0 0 200 300" class="plant p1">

<!-- stem -->
<rect x="97" y="120" width="6" height="140" fill="#6a4a2c"/>

<!-- leaves -->
<ellipse cx="80" cy="200" rx="22" ry="10" fill="#1f7a3f" transform="rotate(-30 80 200)"/>
<ellipse cx="120" cy="210" rx="22" ry="10" fill="#1f7a3f" transform="rotate(30 120 210)"/>

<!-- flower -->

<circle cx="100" cy="60" r="20" fill="#ff9dc0" class="petal"/>
<circle cx="100" cy="120" r="20" fill="#ff9dc0" class="petal"/>

<!-- center -->
<circle cx="100" cy="90" r="10" fill="#ffd166"/>

<!-- grass -->
<rect x="70" y="260" width="6" height="40" fill="#1ecb5a" transform="rotate(-20 70 260)"/>
<rect x="90" y="260" width="6" height="40" fill="#1ecb5a"/>
