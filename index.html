<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Women's Day</title>

<style>

body{
margin:0;
height:100vh;
background: radial-gradient(circle at bottom, #02121c, #000);
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;
}

/* text */

.title{
font-size:64px;
color:#ff6aa9;
margin-bottom:20px;
letter-spacing:2px;
}

.message{
font-size:26px;
margin-bottom:90px;
line-height:1.6;
}

/* garden */

.garden{
display:flex;
gap:120px;
margin-top:-40px;
position:relative;
z-index:1;
}

.title,.message{
position:relative;
z-index:10;
}

/* plant */

.plant{
width:420px;
animation:sway 4s ease-in-out infinite;
transform-origin:bottom center;
}

.p2{animation-delay:1s;}
.p3{animation-delay:2s;}

@keyframes sway{
0%{transform:rotate(-6deg);}
50%{transform:rotate(6deg);}
100%{transform:rotate(-6deg);}
}

/* glow */

.petal{
filter:drop-shadow(0 0 12px rgba(255,120,170,0.7));
}

.grass{
transform-origin:bottom;
animation:grassMove 6s ease-in-out infinite;
}

@keyframes grassMove{
0%{transform:rotate(-3deg);}
50%{transform:rotate(3deg);}
100%{transform:rotate(-3deg);}
}

/* stars */

.stars{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
}

.stars::after{
content:"";
position:absolute;
width:2px;
height:2px;
background:white;
box-shadow:
50px 100px white,
200px 300px white,
400px 150px white,
600px 500px white,
800px 200px white,
1000px 400px white,
1200px 250px white,
1400px 350px white,
1600px 100px white,
1800px 450px white;
}

/* fireflies */

.firefly{
position:absolute;
width:6px;
height:6px;
background:yellow;
border-radius:50%;
box-shadow:0 0 10px yellow;
animation:fly 6s infinite ease-in-out alternate;
}

@keyframes fly{
0%{transform:translate(0,0);opacity:0.3;}
50%{transform:translate(120px,-80px);opacity:1;}
100%{transform:translate(-100px,100px);opacity:0.4;}
}

</style>
</head>

<body>

<div class="stars"></div>

<div>

<h1 class="title">Happy Women's Day</h1>

<p class="message">
Chúc Mai 8/3 vui vẻ, hạnh phúc và càng ngày xinh đẹp hơn.<br>
🌸 🌸 💖 Luôn luôn rạng rỡ 💖 🌸 🌸
</p>

<div class="garden">

<!-- plant 1 -->

<svg viewBox="0 0 200 360" class="plant">

<!-- stem -->
  
<rect x="97" y="110" width="8" height="250" fill="#7a5532" rx="4"/>
  
<!-- leaves -->
<ellipse cx="75" cy="230" rx="28" ry="14" fill="#1f7a3f" transform="rotate(-35 75 230)"/>
<ellipse cx="125" cy="250" rx="28" ry="14" fill="#1f7a3f" transform="rotate(35 125 250)"/>

<!-- flower (more natural) -->

<g class="petal">

<ellipse cx="100" cy="65" rx="30" ry="36" fill="#ff9dc0" transform="rotate(-5 100 65)"/>
<ellipse cx="135" cy="95" rx="30" ry="36" fill="#ff9dc0" transform="rotate(20 135 95)"/>
<ellipse cx="65" cy="95" rx="30" ry="36" fill="#ff9dc0" transform="rotate(-20 65 95)"/>
<ellipse cx="115" cy="120" rx="28" ry="34" fill="#ff8fb5" transform="rotate(15 115 120)"/>
<ellipse cx="85" cy="120" rx="28" ry="34" fill="#ff8fb5" transform="rotate(-15 85 120)"/>

</g>

<circle cx="100" cy="95" r="16" fill="#ffd166"/>

<!-- realistic grass -->

<g class="grass">
<path d="M100 360 Q80 250 70 170" stroke="#1ecb5a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q60 260 40 200" stroke="#22d36a" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q120 250 130 170" stroke="#1ecb5a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q150 260 165 210" stroke="#22d36a" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q90 280 95 200" stroke="#28e070" stroke-width="4" fill="none" stroke-linecap="round"/>

</g>

</svg>

<!-- plant 2 -->

<svg viewBox="0 0 200 360" class="plant p2">

<rect x="97" y="110" width="8" height="250" fill="#7a5532" rx="4"/>
  
<ellipse cx="75" cy="230" rx="28" ry="14" fill="#1f7a3f" transform="rotate(-35 75 230)"/>
<ellipse cx="125" cy="250" rx="28" ry="14" fill="#1f7a3f" transform="rotate(35 125 250)"/>

<g class="petal">
<ellipse cx="100" cy="65" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="135" cy="95" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="65" cy="95" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="115" cy="120" rx="28" ry="34" fill="#ff8fb5"/>
<ellipse cx="85" cy="120" rx="28" ry="34" fill="#ff8fb5"/>
</g>

<circle cx="100" cy="95" r="16" fill="#ffd166"/>

<g class="grass">
<path d="M100 360 Q80 250 70 170" stroke="#1ecb5a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q60 260 40 200" stroke="#22d36a" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q120 250 130 170" stroke="#1ecb5a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q150 260 165 210" stroke="#22d36a" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q90 280 95 200" stroke="#28e070" stroke-width="4" fill="none" stroke-linecap="round"/>

</g>
  
</svg>

<!-- plant 3 -->

<svg viewBox="0 0 200 360" class="plant p3">

<rect x="97" y="110" width="8" height="250" fill="#7a5532" rx="4"/>
  
<ellipse cx="75" cy="230" rx="28" ry="14" fill="#1f7a3f" transform="rotate(-35 75 230)"/>
<ellipse cx="125" cy="250" rx="28" ry="14" fill="#1f7a3f" transform="rotate(35 125 250)"/>

<g class="petal">
<ellipse cx="100" cy="65" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="135" cy="95" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="65" cy="95" rx="30" ry="36" fill="#ff9dc0"/>
<ellipse cx="115" cy="120" rx="28" ry="34" fill="#ff8fb5"/>
<ellipse cx="85" cy="120" rx="28" ry="34" fill="#ff8fb5"/>
</g>

<circle cx="100" cy="95" r="16" fill="#ffd166"/>
  
<g class="grass">
<path d="M100 360 Q80 250 70 170" stroke="#1ecb5a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q60 260 40 200" stroke="#22d36a" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q120 250 130 170" stroke="#1ecb5a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q150 260 165 210" stroke="#22d36a" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M100 360 Q90 280 95 200" stroke="#28e070" stroke-width="4" fill="none" stroke-linecap="round"/>

</g>
  
</svg>

</div>

</div>

<div class="firefly" style="top:60%;left:30%"></div>
<div class="firefly" style="top:55%;left:50%"></div>
<div class="firefly" style="top:70%;left:70%"></div>
<div class="firefly" style="top:65%;left:40%"></div>
<div class="firefly" style="top:40%;left:20%"></div>
<div class="firefly" style="top:45%;left:80%"></div>
<div class="firefly" style="top:30%;left:60%"></div>
  
</body>
</html>
